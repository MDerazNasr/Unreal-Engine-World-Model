[project]
name = "motionworld"
version = "0.1.0"
description = "Action-conditioned residual dynamics for real-time Unreal character control"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.4,<3",
]

[project.scripts]
motionworld-control-service = "motionworld.control.service:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionworld"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
